# Stateless static site — Flutter web output
# app/docs/ is committed on every flutter-web.yml run
services:
  - type: web
    name: wanderless-tourism
    runtime: static
    buildCommand: echo "Static site — built by GitHub Actions"
    staticPublishPath: app/docs
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
