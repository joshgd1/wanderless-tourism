name: Build Flutter Web → docs/ + GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: "stable"

      - run: |
          cd app
          flutter pub get
          flutter create --platforms=web .

      - name: Set app title in web/index.html
        run: |
          sed -i 's/<title>wanderless<\/title>/<title>WanderLess<\/title>/' app/web/index.html
          sed -i 's/content="wanderless"/content="WanderLess"/' app/web/index.html

      - run: rm -rf app/.dart_tool

      - run: flutter build web --base-href=/wanderless-tourism/ --output-dir=docs
        working-directory: ./app

      - run: touch app/docs/.nojekyll

      - name: Commit docs/ to repo
        run: |
          git config --local user.email "noreply@anthropic.com"
          git config --local user.name "Claude Actions"
          git add app/docs/
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "chore: commit Flutter web build artifacts"
          git push || echo "Push skipped (no changes)"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-and-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
